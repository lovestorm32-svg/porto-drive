name: Build Porto Drive Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK and AAB
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Code
      uses: actions/setup-java@v5

    - name: Set up Node.js Environment
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Java JDK 21 (Temurin)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Project Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Sync Capacitor Android Project
      run: npx cap sync android

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        cd android
        chmod +x ./gradlew

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace

    - name: Build Android App Bundle (AAB for Google Play Store)
      run: |
        cd android
        ./gradlew bundleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
    
      with:
        name: PortoDrive-Release-APK
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 14

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v5
      with:
        name: PortoDrive-GooglePlay-AAB
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 14
