name: Build Porto Drive Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Java JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Project Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Sync Capacitor Android Project
      run: npx cap sync android

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        cd android
        chmod +x ./gradlew

    - name: Build Signed Android Release and Debug APKs
      run: |
        cd android
        ./gradlew assembleRelease assembleDebug bundleRelease --stacktrace

    - name: Prepare Release Artifacts
      run: |
        mkdir -p dist-binaries
        # Find and copy release APK (signed via debug config)
        cp $(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1) dist-binaries/porto-drive-release.apk
        # Copy debug APK
        cp $(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1) dist-binaries/porto-drive-debug.apk
        # Copy release AAB
        cp $(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1) dist-binaries/porto-drive-release.aab
        ls -lh dist-binaries/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortoDrive-Release-APK
        path: dist-binaries/porto-drive-release.apk
        retention-days: 14

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortoDrive-Debug-APK
        path: dist-binaries/porto-drive-debug.apk
        retention-days: 14

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortoDrive-GooglePlay-AAB
        path: dist-binaries/porto-drive-release.aab
        retention-days: 14

    - name: Publish to GitHub Releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0.0 dist-binaries/* --clobber || \
        gh release create v1.0.0 dist-binaries/* \
          --title "Porto Drive v1.0.0 (Official Release APK)" \
          --notes "تطبيق بورتو درايف - Porto Drive للأندرويد. جاهز للتحميل والتثبيت المباشر على الهاتف بدون قيود."
